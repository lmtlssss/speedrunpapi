name: IWLS functions
on:
  push:
    paths:
      - 'hardware/iwls/**'
      - '.github/workflows/iwls.yml'
  pull_request:
    paths:
      - 'hardware/iwls/**'
      - '.github/workflows/iwls.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Contest truth tables at a pinned commit
        run: |
          set -euo pipefail
          mkdir truth
          for e in $(seq 280 299); do
            curl -fsSL "https://raw.githubusercontent.com/alanminko/iwls2026-ls-contest/91ad493f4b7732fcbf5384c24c18baef3e07a0c2/benchmarks/truth/ex$e.truth" -o "truth/ex$e.truth"
          done
          cd truth && sha256sum -c ../hardware/iwls/truth.sha256
      - name: Rules and circuits against the tables on every input
        run: python3 hardware/iwls/check.py truth
