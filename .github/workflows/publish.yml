name: Publish ᑕ. package
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Package registry
        required: true
        type: choice
        options:
          - npm
          - pypi
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    if: inputs.registry == 'npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Match the published release
        run: test "$(node -p 'require("./package.json").version')" = "0.3.1"
      - name: Publish signed npm provenance
        run: npm publish --provenance --access public
  pypi:
    if: inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build --wheel ./python --outdir dist
      - name: Publish with PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
