name: Distribution check
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm pack --dry-run
      - run: node bin/speedrunpapi.mjs version
      - run: node bin/speedrunpapi.mjs scan examples/modsum-safe.circom --json
      - run: node bin/speedrunpapi.mjs scan examples/and.circom --json
      - run: node bin/speedrunpapi.mjs scan examples/compare.circom --json
      - run: node bin/speedrunpapi.mjs scan examples/mux.circom --json
      - name: Check compiler R1CS source-bound certificate
        run: |
          node bin/speedrunpapi.mjs scan examples/circom_multiplier.r1cs --json > /tmp/r1cs-result.json
          node bin/speedrunpapi.mjs verify /tmp/r1cs-result.json --source examples/circom_multiplier.r1cs
      - name: Free R1CS wire remains undecided
        run: |
          set +e
          node bin/speedrunpapi.mjs scan examples/free_wire.r1cs --json > /tmp/free-r1cs.json
          status=$?
          set -e
          test "$status" -eq 3
          node -e 'let r=require("/tmp/free-r1cs.json");if(r.verdict!=="Unknown")process.exit(1)'

      - name: Native Script, zkVM trace and coupled R1CS source verification
        run: |
          set -euo pipefail
          node bin/speedrunpapi.mjs scan examples/native_add.bitvm --json > /tmp/native-script.json
          node bin/speedrunpapi.mjs verify /tmp/native-script.json --source examples/native_add.bitvm
          node bin/speedrunpapi.mjs scan examples/native_add_hex.script --json > /tmp/native-bytecode.json
          node bin/speedrunpapi.mjs verify /tmp/native-bytecode.json --source examples/native_add_hex.script
          node bin/speedrunpapi.mjs scan examples/rv32im_arithmetic_trace.zkvm --json > /tmp/native-zkvm.json
          node bin/speedrunpapi.mjs verify /tmp/native-zkvm.json --source examples/rv32im_arithmetic_trace.zkvm
          node bin/speedrunpapi.mjs scan examples/coupled_rank.r1cs --json > /tmp/native-r1cs.json
          node bin/speedrunpapi.mjs verify /tmp/native-r1cs.json --source examples/coupled_rank.r1cs
          set +e
          node bin/speedrunpapi.mjs scan examples/rv32im_corrupt_trace.zkvm --json > /tmp/invalid-zkvm.json
          zkvm_status=$?
          node bin/speedrunpapi.mjs scan examples/coupled_rank_deficient.r1cs --json > /tmp/invalid-r1cs.json
          rank_status=$?
          set -e
          test "$zkvm_status" -eq 3
          test "$rank_status" -eq 3
          jq -e '.verdict == "Unknown"' /tmp/invalid-zkvm.json
          jq -e '.verdict == "Unknown"' /tmp/invalid-r1cs.json

      - name: Exact BitVM, control-flow zkVM and nonlinear R1CS source rechecks
        run: |
          set -euo pipefail
          for fixture in native_alt_hash.bitvm native_alt_hash_hex.script rv32im_memory_branch_v2.zkvm nonlinear_square_zero.r1cs; do
            node bin/speedrunpapi.mjs scan "examples/$fixture" --json > /tmp/extended.json
            node bin/speedrunpapi.mjs verify /tmp/extended.json --source "examples/$fixture" | grep exact_source_recheck
          done
          set +e
          node bin/speedrunpapi.mjs scan examples/rv32im_bad_branch_v2.zkvm --json > /tmp/bad-branch.json
          branch_status=$?
          node bin/speedrunpapi.mjs scan examples/nonlinear_two_roots.r1cs --json > /tmp/two-roots.json
          roots_status=$?
          set -e
          test "$branch_status" -eq 3
          test "$roots_status" -eq 3
          jq -e '.verdict == "Unknown"' /tmp/bad-branch.json
          jq -e '.verdict == "Unknown"' /tmp/two-roots.json
      - name: Machine output stays clean; bibliography is opt-in
        run: |
          set -euo pipefail
          node bin/speedrunpapi.mjs scan examples/modsum-safe.circom --json > /tmp/clean-cli.json
          node bin/speedrunpapi.mjs scan examples/modsum-safe.circom --json --references > /tmp/research-cli.json
          jq -e '.verdict == "Certified" and .certificate.theorem_ref == null and .certificate.two_stage_count == "76"' /tmp/clean-cli.json
          jq -e '.verdict == "Certified" and (.certificate.theorem_ref | startswith("DOI "))' /tmp/research-cli.json
          node bin/speedrunpapi.mjs verify /tmp/clean-cli.json
          node bin/speedrunpapi.mjs verify /tmp/research-cli.json
      - name: Test reusable ᑕ. Action
        uses: ./
        with:
          file: examples/modsum-safe.circom
      - name: Broken case returns code 2
        run: |
          set +e
          node bin/speedrunpapi.mjs scan examples/modsum-broken.circom --json > /tmp/broken.json
          status=$?
          set -e
          test "$status" -eq 2
          node -e 'let r=require("/tmp/broken.json"); if(r.verdict!=="Broken" || !r.counterexample) process.exit(1)'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install './python[onnx]'
      - run: speedrunpapi version
      - name: Independently replay live production ONNX proof from npm and PyPI clients
        run: |
          set -euo pipefail
          source=proofs/hosted-onnx-production-20261110/source.onnx
          artifacts=proofs/hosted-onnx-production-20261110/artifacts
          node bin/speedrunpapi.mjs verify-onnx "$source" "$artifacts" | jq -e '.ok == true and .verified_stages == 1'
          speedrunpapi verify-onnx "$source" "$artifacts" | jq -e '.ok == true and .verified_stages == 1'
          cp -R proofs/hosted-onnx-production-20261110 /tmp/forged-onnx
          python -c 'from pathlib import Path; p=Path("/tmp/forged-onnx/artifacts/candidate.onnx"); b=bytearray(p.read_bytes()); b[-1] ^= 1; p.write_bytes(b)'
          if speedrunpapi verify-onnx /tmp/forged-onnx/source.onnx /tmp/forged-onnx/artifacts; then
            echo 'Forged delivered ONNX model was accepted' >&2
            exit 1
          fi
