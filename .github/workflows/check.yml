name: Distribution check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm pack --dry-run
      - run: node bin/speedrunpapi.mjs version | grep -F "speedrunpapi 0.7.0"
      - name: Install pinned circom
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/circom-bin"
          curl -fsSL https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64 -o "$RUNNER_TEMP/circom-bin/circom"
          echo "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  $RUNNER_TEMP/circom-bin/circom" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/circom-bin/circom"
          echo "$RUNNER_TEMP/circom-bin" >> "$GITHUB_PATH"
      - name: Example verdicts and exit codes
        run: |
          set -uo pipefail
          expect() {
            want="$1"; code="$2"; shift 2
            got=0; node bin/speedrunpapi.mjs scan "$@" --json > /tmp/result.json || got=$?
            verdict=$(jq -r .verdict /tmp/result.json)
            if [ "$verdict" != "$want" ] || [ "$got" != "$code" ]; then
              echo "::error::$* gave $verdict (exit $got), expected $want (exit $code)"; head -c 2000 /tmp/result.json; exit 1
            fi
          }
          for f in and mux compare iszero num2bits division-guarded modsum-safe; do expect Certified 0 "examples/$f.circom"; done
          for f in num2bits254 division decoder modsum-broken; do expect Broken 2 "examples/$f.circom"; done
          expect Certified 0 examples/circom_multiplier.r1cs
          expect Certified 0 examples/coupled_rank.r1cs
          expect Certified 0 examples/nonlinear_square_zero.r1cs
          expect Broken 2 examples/coupled_rank_deficient.r1cs
          expect Broken 2 examples/nonlinear_two_roots.r1cs
          # Output determinism ignores an internal wire that no output depends on; --strict does not.
          expect Certified 0 examples/free_wire.r1cs
          expect Unknown 3 examples/free_wire.r1cs --strict
      - name: A source is never judged by its wording
        run: |
          set -euo pipefail
          printf '%s\n' 'pragma circom 2.0.0;' \
            'template BinSum(n, ops) { signal input in[ops][n]; signal output out[n]; for (var i = 0; i < n; i++) { out[i] <-- 0; } }' \
            'template BigAdd() { signal input a; signal output out; out <-- a * 12345; }' \
            'component main = BigAdd();' > /tmp/BigAdd.circom
          set +e; node bin/speedrunpapi.mjs scan /tmp/BigAdd.circom --json > /tmp/bait.json; code=$?; set -e
          test "$code" -eq 2
          jq -e '.verdict == "Broken" and .counterexample.differing_outputs[0].name == "main.out"' /tmp/bait.json
          # Removed input types make no claim.
          printf 'OP_1 OP_2 OP_ADD\n' > /tmp/add.bitvm
          printf 'module add8(input [7:0] a, input [7:0] b, output [7:0] sum); assign sum = a + b; endmodule\n' > /tmp/add8.v
          printf '{"format":"rv32im-trace-v1","steps":[]}\n' > /tmp/trace.zkvm
          for f in /tmp/add.bitvm /tmp/add8.v /tmp/trace.zkvm; do
            set +e; node bin/speedrunpapi.mjs scan "$f" --json > /tmp/removed.json; code=$?; set -e
            test "$code" -eq 3
            jq -e '.verdict == "Unknown" and .method == "unsupported_input"' /tmp/removed.json
          done
      - name: Reports replay in both checkers and tampering is rejected
        run: |
          set -euo pipefail
          mkdir -p /tmp/rep
          for f in iszero num2bits modsum-safe division-guarded division decoder num2bits254; do
            node bin/speedrunpapi.mjs scan "examples/$f.circom" --report "/tmp/rep/$f.report.json" > /dev/null || true
            node bin/speedrunpapi.mjs verify "/tmp/rep/$f.report.json" --source "/tmp/rep/$f.r1cs" | jq -e '.ok == true and .claim_verified == true'
            python3 verifiers/determinism/determinism_check.py "/tmp/rep/$f.r1cs" "/tmp/rep/$f.report.json" | jq -e '.ok == true and .claim_verified == true'
          done
          reject() {
            if node bin/speedrunpapi.mjs verify "$1" --source "$2" > /dev/null; then echo "::error::JavaScript checker accepted $1"; exit 1; fi
            if python3 verifiers/determinism/determinism_check.py "$2" "$1" > /dev/null; then echo "::error::Python checker accepted $1"; exit 1; fi
          }
          # Certified claimed for an under-constrained circuit.
          jq '.verdict = "Certified" | .proof = {steps: [], step_count: 0, replayed: true} | del(.counterexample)' /tmp/rep/division.report.json > /tmp/forged-empty.json
          reject /tmp/forged-empty.json /tmp/rep/division.r1cs
          jq '.verdict = "Certified" | .proof = {steps: [{t: "lin", k: 0, x: 1}], step_count: 1, replayed: true} | del(.counterexample)' /tmp/rep/division.report.json > /tmp/forged-lin.json
          reject /tmp/forged-lin.json /tmp/rep/division.r1cs
          # A derivation with its steps removed, and one moved to another circuit.
          jq '.proof.steps = []' /tmp/rep/iszero.report.json > /tmp/emptied.json
          reject /tmp/emptied.json /tmp/rep/iszero.r1cs
          reject /tmp/rep/iszero.report.json /tmp/rep/division.r1cs
          # A counterexample whose two witnesses are the same.
          jq '.counterexample.witness_b = .counterexample.witness_a' /tmp/rep/decoder.report.json > /tmp/same.json
          reject /tmp/same.json /tmp/rep/decoder.r1cs
      - name: circomlib templates through --main, includes and an assumption
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/iden3/circomlib /tmp/circomlib
          git -C /tmp/circomlib checkout --quiet cff5ab6288b55ef23602221694a6a38a0239dcc0
          lib=/tmp/circomlib/circuits
          verdict() { node bin/speedrunpapi.mjs scan "$@" --json > /tmp/lib.json || true; jq -r .verdict /tmp/lib.json; }
          test "$(verdict $lib/comparators.circom --main 'LessThan(64)' -l $lib)" = Certified
          test "$(verdict $lib/poseidon.circom --main 'Poseidon(2)' -l $lib)" = Certified
          test "$(verdict $lib/multiplexer.circom --main 'Multiplexer(2, 4)' -l $lib)" = Certified
          test "$(verdict $lib/multiplexer.circom --main 'Decoder(4)' -l $lib)" = Broken
          test "$(verdict $lib/montgomery.circom --main 'MontgomeryAdd()' -l $lib)" = Broken
          test "$(verdict $lib/babyjub.circom --main 'BabyAdd()' -l $lib)" = Unknown
          test "$(verdict $lib/pedersen.circom --main 'Pedersen(8)' -l $lib)" = Broken
          test "$(verdict $lib/pedersen.circom --main 'Pedersen(8)' -l $lib --assume-binary in)" != Broken
          test "$(verdict $lib/sha256/sha256compression.circom --main 'Sha256compression()' -l $lib)" = Certified
          jq -e '.circuit.constraints == 202784 and .proof.step_count > 190000 and .binding.flags == ["--r1cs","--sym","--O0"]' /tmp/lib.json
      - name: Action passes on a deterministic circuit
        uses: ./
        with:
          file: examples/iszero.circom
      - name: Action fails on an under-constrained circuit
        id: broken_action
        continue-on-error: true
        uses: ./
        with:
          file: examples/division.circom
      - name: Enforce the failure
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.broken_action.outcome }}
        run: test "$ACTION_OUTCOME" = failure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install './python[onnx]'
      - run: speedrunpapi version
      - name: Python wheel replays R11 mathematical results
        run: |
          for name in m02-tap-span m03-affine-inverse m04-two-stage m05-cascade m06-shared-input m07-rank35 m08-signed20 m09-binary-word m10-cyclic-energy m11-lattice-phase m12-damped-horizon m13-affine-cycle m14-taa-cost; do
            speedrunpapi check "examples/$name.math" "examples/$name.result.json" | grep '"source_bound": true'
          done
      - name: Independently replay live production ONNX proof from npm and PyPI clients
        run: |
          set -euo pipefail
          source=proofs/hosted-onnx-production-20261110/source.onnx
          artifacts=proofs/hosted-onnx-production-20261110/artifacts
          node bin/speedrunpapi.mjs verify-onnx "$source" "$artifacts" | jq -e '.ok == true and .verified_stages == 1'
          speedrunpapi verify-onnx "$source" "$artifacts" | jq -e '.ok == true and .verified_stages == 1'
          cp -R proofs/hosted-onnx-production-20261110 /tmp/forged-onnx
          python -c 'from pathlib import Path; p=Path("/tmp/forged-onnx/artifacts/candidate.onnx"); b=bytearray(p.read_bytes()); b[-1] ^= 1; p.write_bytes(b)'
          if speedrunpapi verify-onnx /tmp/forged-onnx/source.onnx /tmp/forged-onnx/artifacts; then
            echo 'Forged delivered ONNX model was accepted' >&2
            exit 1
          fi
