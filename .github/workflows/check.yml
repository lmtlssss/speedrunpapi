name: Distribution check
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm pack --dry-run
      - run: node bin/speedrunpapi.mjs version
      - run: node bin/speedrunpapi.mjs scan examples/modsum-safe.circom --json
      - run: node bin/speedrunpapi.mjs scan examples/and.circom --json
      - run: node bin/speedrunpapi.mjs scan examples/compare.circom --json
      - run: node bin/speedrunpapi.mjs scan examples/mux.circom --json
      - name: Test reusable ᑕ. Action
        uses: ./
        with:
          file: examples/modsum-safe.circom
      - name: Broken case returns code 2
        run: |
          set +e
          node bin/speedrunpapi.mjs scan examples/modsum-broken.circom --json > /tmp/broken.json
          status=$?
          set -e
          test "$status" -eq 2
          node -e 'let r=require("/tmp/broken.json"); if(r.verdict!=="Broken" || !r.counterexample) process.exit(1)'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./python
      - run: speedrunpapi version
