name: Paid certificate customer pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paid-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scan and request one signed certificate
        id: scan
        uses: ./
        with:
          file: examples/iszero.circom
          api_key: ${{ secrets.COLONY_PILOT_API_KEY }}
          public: 'true'
      - name: Inspect the signed public record
        shell: bash
        env:
          CERT_ID: ${{ steps.scan.outputs.certificate_id }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
        run: |
          set -euo pipefail
          test "$VERDICT" = Certified
          test -n "$CERT_ID"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "https://api.colony.technology/v1/cert/$CERT_ID" -o certificate.json
          jq -e --arg id "$CERT_ID" '.signature_valid == true and .certificate.id == $id and .certificate.result == "Certified" and .certificate.family == "r1cs_output_determinism"' certificate.json
          jq '.certificate' certificate.json > certificate-only.json
          node verifiers/cert/verify.mjs certificate-only.json colony-reports/result.r1cs
          printf 'Signed certificate: https://api.colony.technology/v1/cert/%s\n' "$CERT_ID" >> "$GITHUB_STEP_SUMMARY"
