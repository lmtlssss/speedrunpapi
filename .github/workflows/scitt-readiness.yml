name: SCITT proposal interoperability and RFCXML readiness
on:
  push:
    paths:
      - 'standards/scitt-exact-computation/**'
      - '.github/workflows/scitt-readiness.yml'
  pull_request:
    paths:
      - 'standards/scitt-exact-computation/**'
      - '.github/workflows/scitt-readiness.yml'
permissions:
  contents: read
jobs:
  independent-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install reference verifier and document renderer
        run: python -m pip install cbor2 cryptography xml2rfc
      - name: Cross-language signatures and independent mathematics
        working-directory: standards/scitt-exact-computation/interop/node
        run: |
          npm ci --ignore-scripts
          npm run vectors
          python ../python/verify.py --negative
          python ../python/roundtrip.py
          python ../python/negative_predicates.py
          npm run verify
      - name: Render IETF RFCXML v3
        run: xml2rfc --text standards/scitt-exact-computation/draft-lmtlssss-scitt-exact-computation-00.xml --out /tmp/scitt-exact-computation.txt
