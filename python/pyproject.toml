[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedrunpapi"
version = "0.7.0"
description = "Output-determinism analysis for Circom circuits and R1CS; Python entry to the shared Node engine, with an independent Python checker"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Colony Technology"}]
license-files = ["LICENSE.md"]
keywords = ["circom", "r1cs", "zero-knowledge", "under-constrained", "formal verification", "determinism"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console"]

[project.urls]
Homepage = "https://colony.technology"
Source = "https://github.com/lmtlssss/speedrunpapi"

[project.optional-dependencies]
onnx = ["onnx>=1.16,<2", "numpy>=1.26,<3"]

[project.scripts]
speedrunpapi = "speedrunpapi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["speedrunpapi", "speedrunpapi.verifiers", "speedrunpapi.verifiers.onnx", "speedrunpapi.verifiers.determinism"]

[tool.setuptools.package-data]
speedrunpapi = ["speedrunpapi.mjs", "colony-jobs.mjs"]
