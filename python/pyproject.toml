[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colony-taa"
version = "0.2.0"
description = "ᑕ. exact arithmetic circuit verification; Python entry to the shared Node engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Colony Technology"}]
license-files = ["LICENSE.md"]
keywords = ["circom", "r1cs", "bitvm", "zkvm", "verilog", "state contraction"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console"]

[project.urls]
Homepage = "https://colony.technology"
Source = "https://github.com/lmtlssss/colony-taa"

[project.scripts]
colony = "colony_taa.cli:main"
taa = "colony_taa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["colony_taa"]

[tool.setuptools.package-data]
colony_taa = ["colony.mjs"]
